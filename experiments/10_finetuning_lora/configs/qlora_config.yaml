# ==============================================================================
# QLoRA (Quantized Low-Rank Adaptation) Hyperparameter Configuration
# ==============================================================================

model_name_or_path: "mistralai/Mistral-7B-v0.1"
output_dir: "./experiments/10_finetuning_lora/checkpoints"

# Quantization (4-bit NormalFloat)
quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

# LoRA Architecture Parameters
lora:
  r: 16                  # LoRA rank dimension
  lora_alpha: 32         # Scaling factor
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

# Training Hyperparameters
training:
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  warmup_ratio: 0.03
  max_steps: 100
  learning_rate: 2.0e-4
  fp16: false
  bf16: true
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 50
  optim: "paged_adamw_8bit"
  max_seq_length: 512
